bundle:
  name: brand-performance-manager

workspace:
  # Inherited from your active Databricks CLI profile.
  # Set via: databricks configure --profile <name>

variables:
  catalog:
    description: Unity Catalog catalog holding brand_performance / brand_perf_utils
    default: ar_dpcatalog
  lakebase_project:
    description: Lakebase Autoscaling project backing the HITL routing audit log
    default: brand-performance-manager

targets:

  dev:
    default: true
    mode: development

  prod:
    mode: production
    variables:
      catalog:          prod_catalog
      lakebase_project: brand-performance-manager-prod

resources:

  # ── Lakeflow: raw CSV drops → governed Delta streaming tables ───────────────
  # Auto Loader reads /Volumes/<catalog>/brand_performance/raw_data/landing/<table>/
  # and owns the 5 tables the Genie spaces and the app query.
  pipelines:
    brand_performance_ingest:
      name: bpm-brand-performance-ingest
      catalog: ${var.catalog}
      schema: brand_performance
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ./pipelines/brand_performance_ingest.sql

  apps:
    brand_performance_manager_app:
      name: brand-performance-manager
      description: "Multi-agent CPG brand analytics powered by Databricks AgentBricks"
      source_code_path: ./app

      # ── Lakebase: HITL routing audit log (bpm_audit.routing_decisions) ──────
      # The platform injects PGHOST/PGPORT/PGDATABASE/PGUSER/PGSSLMODE at runtime and
      # gives the app's service principal a Postgres role on this database.
      resources:
        - name: lakebase
          postgres:
            branch:   projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

# ── Notes ─────────────────────────────────────────────────────────────────────
#
# The live dev deployment was created imperatively (see DEPLOY_STATUS.md): the
# pipeline via `databricks pipelines create`, the app via `databricks apps create`
# + `databricks apps update` (resource binding) + `databricks apps deploy`. This
# file mirrors that config. To manage it with the bundle instead, bind the existing
# resources first so the bundle doesn't try to create duplicates:
#      databricks bundle deployment bind brand_performance_ingest <pipeline_id>
#      databricks bundle deployment bind brand_performance_manager_app brand-performance-manager
#
# Prerequisites not managed here: the Lakebase project (databricks postgres
# create-project), the AgentBricks supervisors (_redeploy_mas.py), and the
# BPM_AGENT_ENDPOINT / BPM_WAREHOUSE_ID values in app/app.yaml.
